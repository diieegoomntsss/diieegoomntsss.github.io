<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 5 - Mi creación estática</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
  createCanvas(800, 600);
  background(220);
// Fondo
fill (0)
rect(0,0,800,250)
//Suelo
fill(0, 150, 0)
rect(0,250,800,350)

//Luna
fill(240, 240, 200);
circle (150, 100, 100)

//Estrella
stroke (0, 0, 255)
noFill()
triangle(250, 40, 230, 75, 270, 75);
triangle(250, 90, 230, 50, 270, 50);
stroke(255, 255, 0);
triangle(350, 150, 330, 185, 370, 185);
triangle(350, 195, 330, 160, 370, 160);

//Montaña
stroke (120, 70, 30)
fill(120, 70, 30)
triangle(700,100,600,250,800,250)
triangle(500,70,400,250,600,250)
fill(255,255,255)
triangle(500, 70, 460, 130, 540, 130)


// CASA


// Pared
stroke(0);
strokeWeight(2);
fill(255, 255, 0);
rect(100, 300, 180, 150);

// Tejado
fill(255, 0, 0);
triangle(190, 200, 100, 300, 280, 300);

// Puerta
fill(0);
rect(160, 390, 60, 60);

// Ventana izquierda
stroke(0, 0, 255);
strokeWeight(2);
noFill();
rect(120, 320, 35, 35);

// Ventana derecha
rect(225, 320, 35, 35);

//Arboles
stroke (120, 70, 30)
fill(120, 70, 30)
rect(575,400,50,50)
rect(725,775,30,75)


}
</script>
</body>
</html>
