<script>
//Defino variables
let minuendo;
let sustraendo;
let resta;

//Pido valores al usuario

minuendo=prompt(" Dame un minuendo cualquiera");
sustraendo=prompt(" Dame un sustraendo cualquiera");

//Convierto en Floats

//Hago las operaciones que me da la gana

alert("El resultado de la resta es: " + resta);

document.write("<h1> Sin ánimo de de lucro, el resultado de la resta es: " + resta+ "</h1>");

</script>
