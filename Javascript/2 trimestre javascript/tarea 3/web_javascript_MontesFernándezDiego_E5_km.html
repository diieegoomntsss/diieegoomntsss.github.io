<html>
<head>
 <title>Km a Metros</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>

let km;
let metros;

km = prompt("Dame los kilometros");
km = parseFloat(km);

metros = km * 1000;

alert("El resultado en metros es: " + metros);
document.write("<h1> El resultado en metros es: " + metros + "</h1>");

</script>
</body>
</html>
