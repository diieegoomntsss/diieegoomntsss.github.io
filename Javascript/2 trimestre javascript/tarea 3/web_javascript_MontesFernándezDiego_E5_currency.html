<html>
<head>
 <title>Euros a Dolares</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>

let euros;
let dolares;

euros = prompt("Dame los euros");
euros = parseFloat(euros);

dolares = euros * 1.1;

alert("El resultado en dolares es: " + dolares);
document.write("<h1> El resultado en dolares es: " + dolares + "</h1>");

</script>
</body>
</html>
