<html>
<head>
 <title>Pulgadas a Centimetros</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>

let pulgadas;
let centimetros;

pulgadas = prompt("Dame las pulgadas");
pulgadas = parseFloat(pulgadas);

centimetros = pulgadas * 2.54;

alert("El resultado en centimetros es: " + centimetros);
document.write("<h1> El resultado en centimetros es: " + centimetros + "</h1>");

</script>
</body>
</html>
