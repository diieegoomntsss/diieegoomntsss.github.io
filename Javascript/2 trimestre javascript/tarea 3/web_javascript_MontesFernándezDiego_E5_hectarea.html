<html>
<head>
 <title>Hectareas a m2</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>

let hectareas;
let metros2;

hectareas = prompt("Dame las hectareas");
hectareas = parseFloat(hectareas);

metros2 = hectareas * 10000;

alert("El resultado en m2 es: " + metros2);
document.write("<h1> El resultado en m2 es: " + metros2 + "</h1>");

</script>
</body>
</html>
