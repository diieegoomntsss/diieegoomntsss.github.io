<html>
<head>
 <title>Cuadrado</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>
// Defino variables
let lado;
let area;

// Pido valores al usuario
lado = prompt("Dame un lado cualquiera");


// Convierto en Floats
lado = parseFloat(lado);

// Hago las operaciones
area = lado * lado;

// Muestra el resultado del area
alert("El resultado del area es: " + area);

document.write("<h1> El area es: " + area+ "</h1>");
</script>

</body>
</html>
