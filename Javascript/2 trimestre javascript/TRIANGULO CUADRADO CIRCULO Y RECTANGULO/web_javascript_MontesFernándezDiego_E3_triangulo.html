<html>
<head>
 <title>Triangulo</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>
// Defino variables
let base;
let altura;
let area;

// Pido valores al usuario
base = prompt("Dame la base");
altura = prompt("Dame la altura");

// Convierto en Floats
base = parseFloat(base);
altura = parseFloat(altura);

// Hago las operaciones
area = (base * altura) / 2;

// Muestra el resultado del area
alert("El resultado del area es: " + area);

document.write("<h1> El area es: " + area+ "</h1>");
</script>

</body>
</html>
