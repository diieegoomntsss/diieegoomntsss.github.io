<html>
<head>
 <title>Circulo</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>
// Defino variables
let radio;
let area;

// Pido valores al usuario
radio = prompt("Dame el radio");

// Convierto en Floats
radio = parseFloat(radio);

// Hago las operaciones
area = Math.PI * radio * radio;

// Muestra el resultado del area
alert("El resultado del area es: " + area);

document.write("<h1> El area es: " + area+ "</h1>");
</script>

</body>
</html>
