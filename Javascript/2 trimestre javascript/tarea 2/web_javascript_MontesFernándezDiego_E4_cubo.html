<html>
<head>
 <title>Volumen Cubo</title>
 <style>
   h1 {color:red}
 </style>
</head>

<body>
<script>
// Defino variables
let lado;
let volumen;

// Pido valores al usuario
lado = prompt("Dame el lado del cubo");

// Convierto en Float
lado = parseFloat(lado);

// Hago las operaciones
volumen = lado * lado * lado;

// Muestro resultado
alert("El volumen es: " + volumen);
document.write("<h1> El volumen es: " + volumen + "</h1>");
</script>

</body>
</html>
