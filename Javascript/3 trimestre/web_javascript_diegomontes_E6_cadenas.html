<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 06 — Cadenas de caracteres</title>
</head>
<body>

    <h1>Ejercicio 06 — Cadenas de caracteres</h1>

    <script>

    // Variables
    var nombre = "Diego";
    var apellidos = "Montes";
    var primera_letra = nombre[0];
    var ultima_letra = nombre[nombre.length - 1];

    // Datos personales
    document.write("<h2>Datos personales</h2>");
    document.write("<p>Mi nombre es: " + nombre + "</p>");
    document.write("<p>Mis apellidos son: " + apellidos + "</p>");
    document.write("<p>Mi nombre completo es: " + nombre + " " + apellidos + "</p>");

    // Trabajo con la cadena
    document.write("<h2>Trabajo con la cadena</h2>");
    document.write("<p>La primera letra de mi nombre es: " + primera_letra + "</p>");
    document.write("<p>Mi nombre tiene " + nombre.length + " caracteres</p>");
    document.write("<p>La última letra de mi nombre es: " + ultima_letra + "</p>");

    // Caracteres especiales
    document.write("<h2>Uso de caracteres especiales</h2>");
    document.write("<pre>Nombre:\t" + nombre + "\nApellidos:\t" + apellidos + "</pre>");

    </script>

</body>
</html>
