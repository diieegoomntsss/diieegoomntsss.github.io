<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 04 — Operadores lógicos</title>
</head>
<body>

    <h1>Ejercicio 04 — Operadores lógicos</h1>

    <script>
        // Variables iniciales
        var A = 10;
        var B = 20;

        // Mostrar resultados
        document.write("<h2>Resultados de operadores lógicos</h2>");

        // Operador AND
        document.write("<p>(A < B && B < A): " + (A < B && B < A) + "</p>");

        // Operador OR
        document.write("<p>(A < B || B < A): " + (A < B || B < A) + "</p>");

        // Operador NOT
        document.write("<p>!(A < B): " + (!(A < B)) + "</p>");

        // Dos expresiones propias (reto)
        document.write("<p>(A > 5 && B < 30): " + (A > 5 && B < 30) + "</p>");
        document.write("<p>(A == 10 || B == 0): " + (A == 10 || B == 0) + "</p>");
    </script>

</body>
</html>
