<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 3 - Figuras y rellenos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
  createCanvas(400, 400);
  background(200);  // Fondo gris suave


  // 1. Pared
  stroke(0, 0, 0); 
  strokeWeight(2); 
  fill(255, 255, 0);
  rect(50, 250, 300, 150);
  
  // 2. Tejado
  stroke(0, 0, 0); 
  strokeWeight(2); 
  fill(255, 0, 0);
  triangle(200, 50, 50, 250, 350, 250);
  
  // 3. PUERTA
  stroke(0, 0, 0); 
  strokeWeight(2); 
  fill(0, 0, 0);
  rect(150, 350, 100, 50)
  
 // 4. Ventana
  stroke(0, 0, 255); 
  strokeWeight(1); 
  fill(0, 0, 0);
  line(100, 270, 100, 300)
  line(100, 300, 130, 300)
  line(130, 300, 130, 270)
  line(130, 270, 100, 270)

// 5. Ventana
  stroke(0, 0, 255); 
  strokeWeight(1); 
  fill(0, 0, 0);
  line(250, 270, 250, 300)
  line(250, 300, 280, 300)
  line(280, 300, 280, 270)
  line(280, 270, 250, 270)

  
  

  
  


  }
</script>
</body>
</html>
