<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 2 - Colores aleatorios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(800, 800);
      background(0,255,0);
      strokeWeight(4);


      // Cada lado recibe un color aleatorio.
      stroke(random(255), random(255), random(255));
      line(100, 100, 100, 700);
      line(100, 100, 200, 400);
      line(200, 400, 100, 700);

      stroke(random(255), random(255), random(255));
      line(300, 100, 300, 700);
      line(300, 100, 400, 350);
      line(400, 350, 500, 100);
      line(500, 100, 500, 700);


      stroke(random(255), random(255), random(255));
      line(600, 100, 600, 700);
      line(600, 100, 750, 100);
      line(600, 250, 700, 250);

    }
  </script>
</body>
</html>
