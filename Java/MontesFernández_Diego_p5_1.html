<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 1 - Mi cuadrado</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(400, 400);
      background(255);

      // Lado superior: rojo, grosor 2.
      stroke(255, 0, 0);
      strokeWeight(2);
      line(50, 80, 300, 80);

      // Lado derecho: verde semitransparente, grosor 4.
      stroke(0, 255, 0, 120);
      strokeWeight(4);
      line(300, 80, 300, 330);

      // Lado inferior: azul, grosor 6.
      stroke(0, 0, 255);
      strokeWeight(6);
      line(300, 330, 50, 330);

      // Lado izquierdo: morado, grosor 8.
      stroke(180, 0, 180);
      strokeWeight(8);
      line(50, 330, 50, 80);
    }
  </script>
</body>
</html>
